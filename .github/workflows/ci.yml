name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Code Quality & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          IFMT=$(gofmt -l .)
          if [ -n "$IFMT" ]; then
            echo "The following files are not formatted properly:"
            echo "$IFMT"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./pkg/config ./pkg/protocol ./pkg/tunnel

  build-matrix:
    name: Cross-Platform Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -o "bin/server_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" ./cmd/server
          go build -o "bin/client_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" ./cmd/client
