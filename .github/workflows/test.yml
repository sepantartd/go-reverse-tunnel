name: Go Test & Tidy Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "go.mod or go.sum is not tidy!" && exit 1)

      - name: Run Tests
        run: go test -v ./...
        
