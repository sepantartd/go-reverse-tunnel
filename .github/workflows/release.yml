name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build for Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o go-reverse-tunnel-linux-amd64 ./cmd/...

      - name: Build for Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o go-reverse-tunnel-windows-amd64.exe ./cmd/...

      - name: Build for Termux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o go-reverse-tunnel-termux-arm64 ./cmd/...

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            go-reverse-tunnel-linux-amd64
            go-reverse-tunnel-windows-amd64.exe
            go-reverse-tunnel-termux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
