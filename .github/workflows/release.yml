name: Release

on:
  push:
    tags:
      - 'v*'   # فقط وقتی تگ با v شروع بشه (مثل v1.2.0)

permissions:
  contents: write   # لازم برای ساخت ریلیز و آپلود فایل‌ها

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # برای changelog و تاریخچه کامل لازمه

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'   # مطابق با go.mod فعلی پروژه‌ات

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '\~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
